external_components:
  - source:
      type: git
      url: https://github.com/jucov/matrix-lamp
      ref: main
    components: [ddp]
    refresh: 60s

ddp:

light:
  # Neopixel with Hyperion / WLED / DDP
  - id: !extend neopixel_led
    effects:
      - addressable_ddp:
          name: WLED / DDP
          timeout: 10s
          disable_gamma: true
